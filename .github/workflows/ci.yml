name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: gofmt -w $(find . -name '*.go' -type f)

      - name: Verify module state
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run tests
        run: go test ./...
