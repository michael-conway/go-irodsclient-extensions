# Host-facing defaults for integration tests against ../irods-grid-stack.
# Keep this aligned with the consumer E2E samples in irods-go-rest and
# irods-go-drs when grid-stack users, ports, zone, or resources change.
IrodsHost: localhost
IrodsPort: 1247
IrodsZone: tempZone
IrodsAdminUser: rods
IrodsAdminPassword: rods
IrodsAuthScheme: native
IrodsNegotiationPolicy: CS_NEG_DONT_CARE
IrodsDefaultResource: providerResc

IrodsPrimaryTestUser: test1
IrodsPrimaryTestPassword: test
IrodsSecondaryTestUser: test2
IrodsSecondaryTestPassword: test
